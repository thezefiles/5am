<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5 AM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="frame">
    <div id="stage">
      <div id="art"></div>
      <div id="hotlabel" hidden></div>
      <div id="overlay"></div>

      <div id="textbox" class="hidden">
        <div id="speaker"></div>
        <div id="text"></div>
        <div id="choices"></div>
        <div id="hint" hidden>▸</div>
      </div>

      <div id="void">
        <div class="dark"></div>
        <div class="absence"></div>
        <div class="vtext"></div>
        <div class="vprompt"></div>
      </div>

      <div id="card" hidden><div class="t"></div><div class="s"></div></div>
      <div id="fade"></div>

      <div id="title" class="screen">
        <div class="clock">05:00</div>
        <h1>5 AM</h1>
        <p class="sub">a game in three mornings</p>
        <div class="menu">
          <button id="btn-begin">Wake up</button>
          <button id="btn-continue" hidden>Continue</button>
        </div>
        <p class="foot">Click or press <kbd>Space</kbd> to read on. Click the glowing points to act.</p>
      </div>

      <div id="end" class="screen" hidden>
        <p class="kicker">Ending</p>
        <h2 id="end-title"></h2>
        <p class="alarm">The alarm goes off. It's 5 AM.</p>
        <p id="end-count"></p>
        <div class="menu"><button id="btn-again">Wake up again</button></div>
      </div>
    </div>
    <button id="mute" title="Toggle sound" aria-label="Toggle sound">♪</button>
  </main>

  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/minigames.js"></script>
  <script src="js/story.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
