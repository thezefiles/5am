<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Eispalast Peißenberg</title>
<style>
  :root {
    --panel: rgba(14, 18, 28, 0.64);
    --panel-border: rgba(255, 255, 255, 0.12);
    --text: #f1eee6;
    --muted: #b3b0a6;
    --accent: #d9b45a;
    --accent-ink: #1d1606;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b0f18; color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #app, #app canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  button {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text);
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 7px 11px; border-radius: 9px; cursor: pointer; transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.14); }
  button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  #btnScout {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left));
    font-size: 14px; padding: 10px 16px; border-radius: 12px; border-color: var(--accent); color: var(--accent);
    background: var(--panel); backdrop-filter: blur(12px) saturate(1.2); -webkit-backdrop-filter: blur(12px) saturate(1.2);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  #btnScout:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); }
  #tip {
    position: fixed; pointer-events: none; padding: 5px 9px; font-size: 12px; font-weight: 600;
    background: rgba(10, 12, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 7px;
    transform: translate(12px, 12px); display: none; white-space: nowrap;
  }
  #info { position: fixed; top: 16px; right: 16px; width: 300px; padding: 14px 16px; display: none; }
  #info h2 { margin: 0 0 6px; font-size: 16px; }
  #info p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
  #info button { margin-top: 10px; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at 50% 70%, #3a2e26 0%, #141824 60%, #0b0f18 100%); z-index: 10; transition: opacity 0.6s;
  }
  #loading .ring { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(217, 180, 90, 0.2); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  #loading p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: 0.04em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #loading .ring { animation-duration: 3s; } }
  @media (max-width: 720px) {
    #info { top: calc(max(16px, env(safe-area-inset-top)) + 56px); left: 16px; right: 16px; width: auto; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<div id="info" class="card">
  <h2 id="infoTitle"></h2>
  <p id="infoText"></p>
  <button id="infoClose" type="button">Close</button>
</div>

<button type="button" id="btnScout" disabled>Scout</button>
<div id="tip"></div>
<div id="loading"><div class="ring"></div><p>Building the Eispalast</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const V3 = THREE.Vector3;
const $ = (id) => document.getElementById(id);
const DEG = Math.PI / 180;
const QS = new URLSearchParams(location.search);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MOBILE = matchMedia('(pointer: coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
// The game opens this file as ...?team=<club>: the Scout button names that club, and once the scout is inside the

const TEAM = QS.get('team') || 'Peißenberg';

// World frame: 1 unit = 1 metre. Origin = the middle of the arena's floor, in the middle of a market town modelled
// loosely on Peißenberg (Upper Bavaria, about 590 m up). +x runs east, +z south, y up. The Hoher Peißenberg rises
// to the west, the Ammer runs north in its valley to the east, the railway passes along the town's east side, and
// the Alps line the southern horizon some 25 to 50 km off. Early October.

/* ------------------------------------------------------------------ */

      const [ax, az] = pts[k], [bx, bz] = pts[k + 1], seg = [ax, az, bx, bz, half], r = half + pad;
      const i0 = Math.floor((Math.min(ax, bx) - r) / c), i1 = Math.floor((Math.max(ax, bx) + r) / c);

/* ------------------------------------------------------------------ */
/*  Renderer, post-processing, controls                                */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: false, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });

renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('app').appendChild(renderer.domElement);
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

THREE.ShaderChunk.fog_fragment = THREE.ShaderChunk.fog_fragment.replace(
  'fogDensity * fogDensity * vFogDepth * vFogDepth', 'fogDensity * vFogDepth');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc9b8a8, 1.0e-5);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 120000);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI / 2 - 0.03;
controls.minDistance = 10;
controls.maxDistance = 9000;
controls.screenSpacePanning = false;

const composerTarget = new THREE.WebGLRenderTarget(innerWidth * DPR, innerHeight * DPR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerTarget);
composer.setPixelRatio(DPR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
// Drop any NaN or infinite pixel (a degenerate normal, an overflowing highlight; some GPUs make them where others
// don't), and cap the very bright. The exponent-bits test survives compilers that optimise isnan() away.
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      uvec4 e = floatBitsToUint(c) & 0x7f800000u;
      gl_FragColor = any(equal(e, uvec4(0x7f800000u))) ? vec4(0.0, 0.0, 0.0, 1.0) : min(max(c, 0.0), vec4(256.0));
    }`

/* ------------------------------------------------------------------ */
/*  Glow registry: everything that lights up at dusk                   */
/* ------------------------------------------------------------------ */
const glowList = [];
const NIGHT = { value: 0 };   // 0 by day, 1 when the lights are fully on; shared with the window shaders
function basicGlow(color, base = 1, min = 0, extra = {}) {
  const m = new THREE.MeshBasicMaterial({ color, ...extra });
  m.userData.base = new THREE.Color(color);

}
function stdGlow(mat, base = 1, min = 0) { glowList.push({ m: mat, base, min }); return mat; }

// flickers as the camera or the traffic moves. Past `near` metres cap what the material can output, reaching `cap`
// at `far` (0 fades it out).

    sh.fragmentShader = 'varying float vFarD;\n' + sh.fragmentShader.replace('#include <opaque_fragment>',
      `#include <opaque_fragment>\ngl_FragColor.rgb = min(gl_FragColor.rgb, vec3(mix(1e4, ${cap.toFixed(2)}, smoothstep(${near.toFixed(1)}, ${far.toFixed(1)}, vFarD))));`);

  NIGHT.value = f;

    const v = g.base * Math.max(f, g.min);
    if (g.m.isMeshBasicMaterial || g.m.isPointsMaterial) {
      if (g.m.userData.base) g.m.color.copy(g.m.userData.base).multiplyScalar(v);
      if (g.m.isPointsMaterial) g.m.opacity = clamp(v, 0, 1);
    } else g.m.emissiveIntensity = v;
  }

/* ------------------------------------------------------------------ */
/*  Procedural textures                                                */
/* ------------------------------------------------------------------ */

const SANS = `system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif`;
const TEX = {};
// Tileable value noise, three scales in r, g, b, for the terrain shader.

  [c, g] = mkCanvas(256, 512);

  for (const x of [0, 216]) { g.fillStyle = '#a9a69f'; g.fillRect(x, 0, 40, 512); g.fillStyle = 'rgba(0,0,0,0.18)'; for (let y = 0; y < 512; y += 24) g.fillRect(x, y, 40, 1.5); g.fillRect(x + 20, 0, 1, 512); }

  for (let r = 0; r < 16; r++) for (let k = 0; k < 16; k++) { const v = R(0.85, 1.15); g.fillStyle = `rgb(${142 * v | 0},${136 * v | 0},${128 * v | 0})`; g.fillRect(k * 16 + (r % 2) * 8 + 1, r * 16 + 1, 14, 14); }

const _ca = new THREE.Color(), _cb = new THREE.Color();
function mixC(target, a, b, k) { target.copy(_ca.set(a)).lerp(_cb.set(b), k); return target; }
let todValue = 0.5;
function setTimeOfDay(t) {
  todValue = t;
  const [A0, B0, k] = t < 0.5 ? [TOD.day, TOD.sunset, t / 0.5] : [TOD.sunset, TOD.night, (t - 0.5) / 0.5];
  const L = (key) => lerp(A0[key], B0[key], k);
  const el = L('el') * DEG, az = L('az') * DEG;
  // Bearing to the world frame: east is +x, north -z.
  const ax = Math.sin(az), azz = -Math.cos(az);
  skyU.sunDir.value.set(ax * Math.cos(el), Math.sin(el), azz * Math.cos(el));
  mixC(skyU.topColor.value, A0.top, B0.top, k); mixC(skyU.midColor.value, A0.mid, B0.mid, k);
  mixC(skyU.horizonColor.value, A0.hor, B0.hor, k); mixC(skyU.groundColor.value, A0.ground, B0.ground, k);
  mixC(skyU.sunColor.value, A0.sunCol, B0.sunCol, k);
  mixC(skyU.cloudLit.value, A0.cloudLit, B0.cloudLit, k); mixC(skyU.cloudShadow.value, A0.cloudShadow, B0.cloudShadow, k);
  skyU.stars.value = L('stars');
  skyU.sunVis.value = L('sunVis') * smooth(-6, 0, L('el'));
  mixC(scene.fog.color, A0.fog, B0.fog, k);
  mixC(hemi.color, A0.hemiSky, B0.hemiSky, k); mixC(hemi.groundColor, A0.hemiGround, B0.hemiGround, k);
  hemi.intensity = L('hemiInt');
  // The light itself never drops below 11 degrees, so the low sun doesn't throw the town into the hill's shadow.
  const elL = Math.max(el, 11 * DEG);
  sun.position.set(ax * Math.cos(elL), Math.sin(elL), azz * Math.cos(elL)).multiplyScalar(2200).add(sun.target.position);
  mixC(sun.color, A0.sunCol, B0.sunCol, k);
  sun.intensity = L('sunInt') * smooth(-4, 3, L('el'));
  moon.intensity = 0.45 * smooth(0.65, 1, t);
  renderer.toneMappingExposure = L('exposure');
  scene.environmentIntensity = L('env');
  // The rails are unlit lines: darken them with the daylight, or they shine across the land at night.
  if (RAIL_LINES.mat) RAIL_LINES.mat.color.setHex(0x8c9298).multiplyScalar(lerp(1, 0.1, smooth(0.45, 0.95, t)));
  if (waterMat) waterMat.color.setHSL(0.53, 0.35, lerp(0.2, 0.05, smooth(0.4, 1, t)));
  applyGlow(L('lights'));
  if (SMOKE.mat) SMOKE.mat.uniforms.uCol.value.setScalar(lerp(0.8, 0.12, smooth(0.5, 0.95, t)));

let envTimer = null, envLast = 0;
function scheduleEnv() {
  const now = performance.now();
  clearTimeout(envTimer);
  if (now - envLast > 250) { envLast = now; updateEnvironment(); }
  else envTimer = setTimeout(() => { envLast = performance.now(); updateEnvironment(); }, 200);
}

/* ------------------------------------------------------------------ */
/*  Cameras, interaction, UI                                           */
/* ------------------------------------------------------------------ */
const VIEWS = {
  aerial: { pos: [230, 120, 300], target: [-10, 20, 10] },
  forecourt: { pos: [-26, 6, 132], target: [4, 22, 20] },
  street: { pos: [-96, 4.5, 330], target: [-104, 8, 120] },
  summit: { pos: [-3835, 460, -150], target: [0, 40, 700] },
  alps: { pos: [-60, 110, -620], target: [0, 260, 6000] },
  orbit: { pos: [-240, 150, 230], target: [0, 20, 0] },
};
let mode = 'free', tween = null, lastFollow = null;
function flyTo(pos, target, dur = 2.4) { tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: new V3(...pos), t1: new V3(...target), start: performance.now() / 1000, dur }; }
function trainPoint() { return new V3().setFromMatrixPosition(TRAIN.cars[0].matrix); }
function goView(view) {
  if (SCOUT.on) return;
  controls.autoRotate = false; lastFollow = null;
  if (view === 'follow') {
    mode = 'follow';
    const p = trainPoint();
    flyTo([p.x - 60, p.y + 25, p.z + 50], [p.x, p.y, p.z], 1.8);
    tween.follow = true;
    return;
  }
  mode = view === 'orbit' ? 'orbit' : 'free';
  const v = VIEWS[view];
  if (view === 'summit') { const gy = groundH(SUMMIT.x, SUMMIT.z); v.pos = [SUMMIT.x + 230, gy + 85, SUMMIT.z + 330]; v.target = [SUMMIT.x - 15, gy + 18, SUMMIT.z - 10]; }
  // Stand in the middle of the Hauptstraße (the houses line both sides of it), looking north up the street.
  if (view === 'street') {
    const at = (z) => ROADS[0].line.reduce((b, p) => (Math.abs(p[1] - z) < Math.abs(b[1] - z) ? p : b));
    const [px, pz] = at(330), [tx, tz] = at(120);
    v.pos = [px, meshH(px, pz).h + 4.5, pz]; v.target = [tx, meshH(tx, tz).h + 8, tz];
  }
  flyTo(v.pos, v.target);
}
controls.addEventListener('start', () => {
  if (tween) tween = null;
  if (mode === 'orbit' || mode === 'follow') { mode = 'free'; controls.autoRotate = false; }
});
let trafficOn = true;
function toggleTraffic() { trafficOn = !trafficOn; }
$('btnScout').addEventListener('click', () => startScout());
addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement && e.target.type !== 'range') return;
  const keys = { Digit1: 'aerial', Digit2: 'forecourt', Digit3: 'street', Digit4: 'summit', Digit5: 'alps', Digit6: 'follow', Digit7: 'orbit' };
  if (keys[e.code]) goView(keys[e.code]);
  else if (e.code === 'KeyT') { const stops = [0.05, 0.5, 0.7, 0.95]; const nxt = stops.find((s) => s > todValue + 0.01) ?? stops[0]; setTimeOfDay(nxt); }
  else if (e.code === 'Space') { e.preventDefault(); toggleTraffic(); }
  else if (e.code === 'KeyS' && !$('btnScout').disabled) startScout();
});
// Hover and click on landmarks.
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
const tip = $('tip'), info = $('info');
let downAt = null;
function pickAt(e) {
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables, false)[0];
  return hit ? hit.object : null;
}
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.buttons) { tip.style.display = 'none'; return; }
  const o = pickAt(e);
  if (o) { tip.textContent = o.userData.info.title; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.style.display = 'block'; renderer.domElement.style.cursor = 'pointer'; }
  else { tip.style.display = 'none'; renderer.domElement.style.cursor = ''; }
});
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5 || SCOUT.on) return;
  const o = pickAt(e);
  if (!o) return;
  $('infoTitle').textContent = o.userData.info.title;
  $('infoText').textContent = o.userData.info.text;
  info.style.display = 'block';
  if (TRAIN.cars && o === TRAIN.cars[0].children[0]) { goView('follow'); return; }
  const box = new THREE.Box3().setFromObject(o), c = box.getCenter(new V3()), size = Math.min(box.getSize(new V3()).length(), 260);
  const dir = camera.position.clone().sub(c).setY(0).normalize();
  mode = 'free'; controls.autoRotate = false;
  flyTo([c.x + dir.x * size * 1.1, c.y + size * 0.45, c.z + dir.z * size * 1.1], [c.x, c.y, c.z], 2);
});
$('infoClose').addEventListener('click', () => { info.style.display = 'none'; });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ------------------------------------------------------------------ */
/*  Main loop                                                          */
/* ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let simTime = 0, first = true;
const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const simDt = trafficOn && !REDUCED ? dt : 0;
  simTime += simDt;
  skyU.time.value += dt;
  TEX.water.offset.y -= dt * 0.02; TEX.pond.offset.x += dt * 0.01;
  updateCars(simDt);
  updatePeople(simDt, simTime);
  updateTrain(simDt);
  updateBalloon(simTime);
  if (!REDUCED) { updateSpray(dt); updateSmoke(dt); FLAGS.forEach((f, i) => waveFlag(f, simTime + i * 0.7)); PIT.wheels.forEach((w) => { w.rotation.z += simDt * 0.4; }); }
  const blink = (performance.now() / 1000) % 1.6 < 0.8;
  [PIT.light, SUMMIT.light].forEach((m) => m.color.copy(m.userData.base).multiplyScalar(blink ? 3 : 0.3));
  updateScout(dt);
  if (!SCOUT.on) {
    if (tween) {
      const k = clamp((performance.now() / 1000 - tween.start) / tween.dur, 0, 1), e = easeInOut(k);
      let p1 = tween.p1, t1 = tween.t1;
      if (tween.follow) { const p = trainPoint(); t1 = p.clone(); p1 = p.clone().add(new V3(-60, 25, 50)); }
      camera.position.lerpVectors(tween.p0, p1, e);
      camera.position.y += Math.sin(Math.PI * e) * Math.min(tween.p0.distanceTo(p1) * 0.12, 600);
      controls.target.lerpVectors(tween.t0, t1, e);
      if (k >= 1) {
        tween = null;
        if (mode === 'orbit') { controls.autoRotate = true; controls.autoRotateSpeed = 0.5; }
        if (mode === 'follow') lastFollow = trainPoint();
      }
    } else if (mode === 'follow') {
      const p = trainPoint();
      if (lastFollow) camera.position.add(p.clone().sub(lastFollow));
      controls.target.copy(p);
      lastFollow = p;
    }
  }
  controls.update();
  const gy = meshH(camera.position.x, camera.position.z).h + 1.5;
  if (camera.position.y < gy) camera.position.y = gy;
  composer.render();
  if (first) {
    first = false;
    const ld = $('loading');
    ld.style.opacity = '0'; setTimeout(() => ld.remove(), 700);
    window.__sceneReady = true;
  }
}

async function init() {
  await tick();
  initPads();
  makeTextures();
  say('Raising the Alps');
  await tick();
  buildTerrain();
  buildRiver();
  await tick();
  say('Laying out the streets');
  buildRoads();
  await tick();
  say('Building the Eispalast');
  buildArena();
  buildForecourt();
  await tick();
  say('Building the town');
  buildLandmarks();
  buildTown();
  await tick();
  say('Planting the woods');
  buildTrees();
  buildLamps();
  await tick();
  buildPeople();
  buildCars();
  buildTrain();
  buildBalloon();
  buildSpray();
  buildSmoke();
  const c = (QS.get('cam') || '').split(',').map(Number);
  if (c.length === 6 && c.every(Number.isFinite)) { camera.position.set(c[0], c[1], c[2]); controls.target.set(c[3], c[4], c[5]); }
  else { camera.position.set(...VIEWS.aerial.pos); controls.target.set(...VIEWS.aerial.target); if (camera.aspect < 0.8) camera.position.sub(controls.target).multiplyScalar(1.6).add(controls.target); }
  controls.update();
  const t0 = parseFloat(QS.get('t'));
  const tv = Number.isFinite(t0) ? clamp(t0, 0, 1) : 0.5;
  setTimeOfDay(tv);
  updateEnvironment();
  $('btnScout').textContent = 'Scout ' + TEAM;
  $('btnScout').disabled = false;
  tellGame({ type: 'ready' });
  frame();
}
init().catch((err) => { console.error(err); say('Could not start the 3D view: ' + err.message); });
