<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Lund</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Josefin+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #10161a;
    --muted: #b9b2a0;
    --ink: #efe7d3;
    --gold: #d9ad4a;
    --line: rgba(217, 173, 74, 0.45);
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    --deco: 'Limelight', 'Josefin Sans', Georgia, serif;
    --sans: 'Josefin Sans', 'Helvetica Neue', Arial, system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ground); color: var(--muted); }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #loader {
    position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: var(--ground);
    transition: opacity 0.7s ease;
  }
  #loader .mark { font: 400 28px var(--deco); letter-spacing: 0.18em; color: var(--gold); }
  #loader .bar { width: 180px; height: 2px; background: rgba(238, 231, 211, 0.12); overflow: hidden; border-radius: 2px; }
  #loader .bar div { width: 40%; height: 100%; background: var(--gold); animation: slide 1.1s ease-in-out infinite; }
  #loader p { margin: 0; font: 500 12px var(--mono); letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; text-align: center; padding: 0 16px; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @media (prefers-reduced-motion: reduce) { #loader .bar div { animation: none; width: 100%; } }

  #hud { position: absolute; left: 16px; top: 16px; z-index: 2; pointer-events: none; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55); }
  #hud h1 { margin: 0; font: 400 22px var(--deco); letter-spacing: 0.14em; color: var(--gold); }
  #hud p { margin: 4px 0 0; font: 600 11px var(--sans); letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); opacity: 0.85; }

  #time {
    position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2;
    box-sizing: border-box; width: min(460px, calc(100% - 32px)); display: flex; align-items: center; gap: 12px;
    padding: 9px 14px; background: rgba(16, 22, 26, 0.6); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #time label { font: 600 11px var(--sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  #time output { font: 500 13px var(--mono); color: var(--ink); min-width: 44px; text-align: right; }
  #time input[type=range] { flex: 1; min-width: 0; accent-color: var(--gold); }
  #hint { position: absolute; right: 16px; top: 18px; z-index: 2; margin: 0; font: 600 10px var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); opacity: 0.7; pointer-events: none; text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55); }
  @media (max-width: 640px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud" hidden><h1>Arena Lund</h1><p>Lund · Skåne · art déco</p></div>
<p id="hint" hidden>Drag to orbit · scroll to zoom · right-drag to pan</p>
<div id="time" hidden>
  <label for="clock">Tid</label>
  <input id="clock" type="range" min="0" max="24" step="0.05" value="16.8" aria-label="Time of day">
  <output id="clockOut" for="clock">16:48</output>
</div>
<div id="loader"><div class="mark">ARENA LUND</div><div class="bar"><div></div></div><p id="loadMsg">Laying out the Skåne plain</p></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/Sky.js"></script>
<script src="js/arena-lund.js"></script>
</body>
</html>
